{% extends "base.html" %}
{% block title %}Регистрация — Лотос{% endblock %}
{% block content %}
<div class="form-wrap">
  <form class="form-card" method="post">
    <h1>Добро пожаловать</h1>
    <p class="sub">Создайте аккаунт, чтобы записаться на массаж.</p>

    <label for="name">Ваше имя</label>
    <input id="name" name="name" required value="{{ request.form.get('name', '') }}">

    <label for="phone">Телефон</label>
    <input id="phone" name="phone" type="tel" placeholder="+7 900 000-00-00" required value="{{ request.form.get('phone', '') }}">

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required value="{{ request.form.get('email', '') }}">

    <label for="password">Пароль (минимум 6 символов)</label>
    <input id="password" name="password" type="password" minlength="6" required>

    <button class="btn" type="submit">Зарегистрироваться</button>
    <p class="switch">Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
  </form>
</div>
{% endblock %}
